services:
  homerp:
    image: ghcr.io/flroppy/homerp:latest
    env_file:
      - .env
    volumes:
      - ./House:/app/House  # Persist item data outside the container
    #ports:
      #- "8000:8000"  # Map port 8000 on the host to port 8000 in the container
    environment:
      - PYTHONUNBUFFERED=1  # Ensure logs are printed directly to the console (useful for debugging)
    restart: unless-stopped
