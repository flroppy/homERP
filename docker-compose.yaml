services:
  python-app:
    build:
      context: .  # Build the image from the current directory
    volumes:
      - .:/app  # Mount the current directory to the container's /app directory
    #ports:
      #- "5000:8000"  # Map port 5000 on the host to port 5000 in the container
    environment:
      - PYTHONUNBUFFERED=1  # Ensure logs are printed directly to the console (useful for debugging)
    #network_mode: host
    #command: python app.py  # Command to run the application
    restart: unless-stopped
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.homERP.loadbalancer.server.port=8000"
      - "traefik.http.routers.homERP.rule=Host(`homERP.mir.meta`)"
      - "traefik.http.routers.homERP.entrypoints=web"
      - "traefik.http.routers.homERP.service=homERP"
      # Homepage auto-discovery
      - "homepage.group=Services"
      - "homepage.name=homERP"
      - "homepage.icon=mdi-folder-home"
      - "homepage.href=http://homERP.mir.meta"

networks:
  proxy:
    external: true
  internal:
    driver: bridge
