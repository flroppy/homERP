name: Build and push image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Debug token
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then echo "GITHUB_TOKEN is EMPTY"; else echo "GITHUB_TOKEN is set, length ${#TOKEN}"; fi
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Gitea container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.mir.meta -u ${{ gitea.actor }} --password-stdin
      - name: Build image
        run: docker build -t ghcr.io/flroppy/homerp:latest .
      - name: Push image
        run: docker push ghcr.io/flroppy/homerp:latest
