name: Release image

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Gitea container registry
        run: echo "${{ secrets.PACKAGE_DEPLOY_TOKEN }}" | docker login git.mir.meta -u floppy --password-stdin
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.ref_name }} -t ghcr.io/flroppy/homerp:${{ github.ref_name }} .
      - name: Tag as latest
        run: docker tag ghcr.io/flroppy/homerp:${{ github.ref_name }} ghcr.io/flroppy/homerp:latest
      - name: Push versioned image
        run: docker push ghcr.io/flroppy/homerp:${{ github.ref_name }}
      - name: Push latest
        run: docker push ghcr.io/flroppy/homerp:latest
