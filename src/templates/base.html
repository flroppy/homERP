<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}House Inventory{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block style %}{% endblock %}
</head>
<body>
    <header>
        {% block header %}House Inventory{% endblock %}
        <form role="search" action="/search" method="get">
            <input type="text" name="query" placeholder="Search…" aria-label="Search" required>
            <button type="submit">Search</button>
        </form>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p><a href="/all-items">All Items</a> &nbsp;|&nbsp; <a href="/fields">Fields</a> &nbsp;|&nbsp; <a href="/git-status">Git status</a></p>
        {% block footer %}{% endblock %}
    </footer>
</body>
</html>
