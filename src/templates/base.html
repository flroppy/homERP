<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}House Inventory{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block style %}{% endblock %}
</head>
<body>
    <header>
        {% block header %}House Inventory{% endblock %}
        <form role="search" action="/search" method="get">
            <input type="text" name="query" placeholder="Search…" aria-label="Search" required>
            <button type="submit">Search</button>
        </form>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        {% set gs = git_backup_status() %}
        <p>
            <a href="/all-items">All Items</a> &nbsp;|&nbsp; <a href="/fields">Fields</a> &nbsp;|&nbsp; <a href="/spark-joy">Spark Joy</a> &nbsp;|&nbsp;
            {% if gs.configured %}
                <a href="/git-status" class="git-status-link {{ 'git-status-error' if gs.error else 'git-status-ok' }}"
                   title="{{ gs.error if gs.error else 'Git backup is working' }}">● Git status</a>
            {% else %}
                <a href="/git-status">Git status</a>
            {% endif %}
        </p>
        {% block footer %}{% endblock %}
    </footer>
</body>
</html>
