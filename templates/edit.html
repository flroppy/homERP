{% extends "base.html" %}

{% block title %}Edit {{ metadata.name }} - House Inventory{% endblock %}

{% block header %}Edit {{ metadata.name }}{% endblock %}

{% block content %}
    <form action="/save/{{ path }}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ metadata.name }}" required>
        
        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="10" required>{{ metadata.content }}</textarea>
        
        <button type="submit">Save Changes</button>
        <a href="/browse/{{ path }}" class="button">Cancel</a>
    </form>
{% endblock %}
