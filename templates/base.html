<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}House Inventory{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <style>
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin-bottom: 1rem;
        }
        .breadcrumb li:not(:last-child)::after {
            content: "›";
            margin: 0 0.5rem;
        }
        .breadcrumb li a {
            border:none;
            margin:0px;
            padding:0px;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .item-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1rem;
            text-align: center;
        }
        .attachments-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .attachment-card {
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .barcode {
            margin: 1rem 0;
            text-align: center;
        }
        .barcode img {
            max-width: 100%;
            height: auto;
            margin-bottom: 0.5rem;
        }
        .item-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style></head>
<body>
    <header>
        {% block header %}House Inventory{% endblock %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 House Inventory App</p>
    </footer>
</body>
</html>
