{% extends "base.html" %}

{% block title %}Move {{ item_name }} - House Inventory{% endblock %}

{% block header %}Move {{ item_name }}{% endblock %}

{% block content %}
    <form action="/move/{{ item_path }}" method="post" id="move-item">
        <label for="by_id">Destination ID</label>
        <input type="text" id="by_id" name="by_id" placeholder="8-character ID" autofocus>

        <label for="search">Filter destination</label>
        <input type="text" id="search" name="search" placeholder="Search items…" oninput="filterItems()">

        <label for="destination">Choose a destination</label>
        <select id="destination" name="destination">
            {% for item in items %}
                <option value="{{ item.path }}">{{ item.path }}</option>
            {% endfor %}
        </select>

        <button type="submit">Move</button>
        <a href="/browse/{{ parent_path }}">Cancel</a>
    </form>

    <script>
        function filterItems() {
            const term = document.getElementById('search').value.toLowerCase();
            const options = document.querySelectorAll('select#destination option');
            options.forEach(o => { o.style.display = o.textContent.toLowerCase().includes(term) ? '' : 'none'; });
            const first = Array.from(options).find(o => o.style.display !== 'none');
            if (first) document.getElementById('destination').value = first.value;
        }

        document.getElementById('by_id').addEventListener('input', function () {
            if (this.value.length === 8) document.getElementById('move-item').submit();
        });
    </script>
{% endblock %}
