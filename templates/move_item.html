{% extends "base.html" %}
{% block title %}Move {{ item_name }} - House Inventory{% endblock %}
{% block header %}Move {{ item_name }}{% endblock %}

{% block content %}
    <form action="/move/{{ item_path }}" method="post" id="move-form">
        <input type="hidden" name="destination" id="destination-value">
        <input type="hidden" name="by_id" id="by-id-value">

        <label for="destination-input">Move to</label>
        <input type="text" id="destination-input" placeholder="Search for a location…" autocomplete="off" autofocus>
        <small id="destination-hint" style="color:var(--muted)"></small>

        <button type="submit" id="move-btn" disabled>Move here</button>
        <a href="/browse/{{ item_path }}">Cancel</a>
    </form>

    <script src="/static/fields-autocomplete.js"></script>
    <script>
    let _paths = [];

    fetch('/api/tree').then(r => r.json()).then(data => {
        _paths = [];
        function walk(nodes, prefix) {
            nodes.forEach(n => {
                const p = prefix ? prefix + '/' + n.name : n.name;
                _paths.push(p);
                walk(n.children || [], p);
            });
        }
        walk(data.tree || [], '');
        // Remove the item being moved and its descendants from options
        const self = {{ item_path | tojson }};
        _paths = _paths.filter(p => p !== self && !p.startsWith(self + '/'));
    });

    const input   = document.getElementById('destination-input');
    const hidden  = document.getElementById('destination-value');
    const hint    = document.getElementById('destination-hint');
    const btn     = document.getElementById('move-btn');

    autocomplete(input, q => {
        if (!q) return _paths.slice(0, 20);
        try { return _paths.filter(p => new RegExp(q, 'i').test(p)).slice(0, 20); }
        catch { return _paths.filter(p => p.toLowerCase().includes(q.toLowerCase())).slice(0, 20); }
    });

    function selectPath(path) {
        hidden.value = path;
        hint.textContent = path ? 'Destination: ' + path : '';
        btn.disabled = !path;
    }

    input.addEventListener('ac-select', () => selectPath(input.value));

    // On manual input: if it looks like a scanned 8-char ID, enable the button so
    // hardware scanners (which type + press Enter) still work without auto-submitting
    // on accidentally-typed 8-char location names.
    input.addEventListener('input', function () {
        const v = this.value.trim();
        if (/^[A-Za-z0-9_-]{8}$/.test(v)) {
            hidden.value = '';
            document.getElementById('by-id-value').value = v;
            hint.textContent = 'ID: ' + v;
            btn.disabled = false;
        } else {
            selectPath('');
        }
    });
    </script>
{% endblock %}
